<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFlow | Recuperar senha</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<main class="container">
    <header class="cabecalho">
        <div class="logo">MyFlow</div>
        <h1>Vamos recuperar seu acesso</h1>
        <p>Informe o e-mail utilizado no seu cadastro.</p>
    </header>
    <section class="formulario-container">
        <div class="titulo-formulario"><h2>Esqueceu sua senha?</h2><p>Enviaremos instruções para criar uma nova senha.</p></div>
        {% if sucesso %}<div class="mensagem sucesso" role="status"><p>{{ sucesso }}</p></div>{% endif %}
        {% if erro %}<div class="mensagem erro" role="alert"><p>{{ erro }}</p></div>{% endif %}
        <form action="{{ url_for('pagina_esqueci_senha') }}" method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="campo"><label for="email">E-mail cadastrado</label><input type="email" id="email" name="email" value="{{ email }}" autocomplete="email" placeholder="voce@exemplo.com" required></div>
            <button type="submit" class="botao-cadastro">Enviar instruções <span aria-hidden="true">→</span></button>
        </form>
        <p class="texto-alternativo"><a href="{{ url_for('pagina_login') }}">Voltar para o login</a></p>
    </section>
    <footer class="rodape"><p>MyFlow — um passo de cada vez.</p></footer>
</main>
</body>
</html>
