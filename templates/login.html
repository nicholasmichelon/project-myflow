<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFlow | Entrar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <main class="container">
        <header class="cabecalho">
            <div class="logo">MyFlow</div>
            <h1>Que bom ter você de volta!</h1>
            <p>Entre na sua conta para continuar organizando seus estudos.</p>
        </header>

        <section class="formulario-container">
            <div class="titulo-formulario">
                <h2>Entrar na sua conta</h2>
                <p>Informe seu e-mail e sua senha.</p>
            </div>

            {% if erro %}
                <div class="mensagem erro" role="alert">
                    <strong>Não foi possível entrar.</strong>
                    <p>{{ erro }}</p>
                </div>
            {% endif %}

            <form action="{{ url_for('pagina_login') }}" method="POST">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ email }}"
                        placeholder="voce@exemplo.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        autocomplete="current-password"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <button type="submit" class="botao-cadastro">
                    Entrar
                    <span aria-hidden="true">&rarr;</span>
                </button>
            </form>

            <p class="texto-alternativo">
                Ainda não tem uma conta?
                <a href="{{ url_for('pagina_cadastro') }}">Criar cadastro</a>
            </p>
        </section>

        <footer class="rodape">
            <p>MyFlow — um passo de cada vez.</p>
        </footer>
    </main>
</body>
</html>
