<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyFlow | Cadastro</title>

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='styles.css') }}"
    >
</head>

<body>
    <main class="container">
        <header class="cabecalho">
            <h1>MyFlow</h1>
            <h2>Vamos organizar sua jornada?</h2>

            <p>
                Conte um pouco sobre você para começar a
                organizar seus estudos.
            </p>
        </header>

        <section class="formulario-container">
            <form action="" method="POST">

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="voce@exemplo.com"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="jornada">
                        Em qual etapa de estudos você está?
                    </label>

                    <select id="jornada" name="jornada" required>
                        <option value="">Selecione sua jornada</option>
                        <option value="Ensino Fundamental">
                            Ensino Fundamental
                        </option>
                        <option value="Ensino Médio">
                            Ensino Médio
                        </option>
                        <option value="Graduação">
                            Graduação
                        </option>
                        <option value="Pós-graduação">
                            Pós-graduação
                        </option>
                        <option value="Curso livre">
                            Curso livre
